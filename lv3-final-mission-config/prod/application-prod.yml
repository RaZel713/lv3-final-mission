spring:
  application:
    name: lv3-final-mission
  profiles:
    active: prod

  # MySQL Database for production (RDS 연결)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://razel-db.cqsc6pyqhwww.ap-northeast-2.rds.amazonaws.com:3306/yourdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:userpwd}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    defer-datasource-initialization: false

# Security settings (운영 환경용 - 환경 변수로 보안 강화)
security:
  holiday:
    api:
      service-key: ${HOLIDAY_API_KEY:GbJmfStUjTMn4fHb4w7jqlBGGIk9MnVLW7W22Ig1D6h3A7YaxvfDrAHjHhVGk1a%2BGhIcYysrZ%2BUovxZExR%2BmkA%3D%3D}
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY:prod-secret-key-must-be-changed}
      expire-length: ${JWT_EXPIRE_LENGTH:3600000}

# Logging (운영 환경용 - 최소 로그, 파일 저장)
logging:
  level:
    finalmission: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/beauty-shop/application.log
    max-size: 100MB
    max-history: 30

# Management endpoints (운영 환경용 - 제한적 노출)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Server settings (운영 환경용)
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
